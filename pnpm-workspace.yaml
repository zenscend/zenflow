ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Security patches for transitive dev-tooling deps (from `pnpm audit --fix`,
# then hand-trimmed). Each pin stays inside the consumer's own major line:
# a bare ">=" lets pnpm jump a major and break the consumer — brace-expansion 5
# under minimatch 3 crashes eslint, and js-yaml/fast-uri jumped majors too.
# Re-run `pnpm audit` after dependency bumps and drop entries that go stale.
overrides:
  '@babel/core@<7.29.6': ^7.29.6
  '@humanfs/node@<0.16.8': ^0.16.8
  'baseline-browser-mapping@<2.11.0': ^2.11.0
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'browserslist@<4.28.7': ^4.28.7
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'lodash@<4.18.0': ^4.18.0
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'picomatch@<2.3.2': ^2.3.2
  'picomatch@>=4.0.0 <4.0.4': ^4.0.4
  'source-map-js@<1.2.2': ^1.2.2
